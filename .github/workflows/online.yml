name: online tests

# Live OpenStreetMap downloads (Python: pytest -m online; R: test-online.R).
# They depend on external services, so they run on demand and when the
# download code changes, not on every pull request.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/online.yml"
      - "src/rd2dnet/network.py"
      - "R-package/R/network.R"
      - "R-package/tests/testthat/test-online.R"

jobs:
  python:
    name: Python (live OSM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,osm]"
      - name: Diagnose geocoding (temporary)
        continue-on-error: true
        run: |
          python - <<'PY'
          import osmnx as ox
          for q in ["Midtown Manhattan, New York", "Midtown, Manhattan, New York, USA"]:
              g = ox.geocode_to_gdf(q)
              print(q, "->", g[["display_name", "class", "type"]].to_dict("records"), g.geometry.iloc[0].geom_type, g.to_crs(32618).area.iloc[0])
              G = ox.graph_from_place(q, network_type="walk")
              print("   graph", len(G), G.number_of_edges())
          print(ox.geocoder.geocode("Midtown Manhattan, New York"))
          PY
      - run: python -m pytest -m online -v

  r:
    name: R (live OSM)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RD2DNET_ONLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package
          extra-packages: any::devtools, any::dodgr, any::osmdata, any::sf
      - name: Run the online test
        working-directory: R-package
        run: Rscript -e 'devtools::test(filter = "online", stop_on_failure = TRUE)'
