name: parity

# Cross-language parity: random designs are run in Python (the reference) and in
# R, and every coordinate, estimate, standard error, bandwidth and status must
# agree to 1e-7. The Stata side is run by hand with parity/run_stata.do.

on:
  push:
    branches: [main]
    paths: ["src/**", "R-package/**", "parity/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["src/**", "R-package/**", "parity/**", ".github/workflows/parity.yml"]

jobs:
  parity:
    name: Python vs R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Python package
        run: pip install -e .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package
          dependencies: '"hard"'
      - name: Install the R package
        run: R CMD INSTALL R-package
      - name: Generate cases and Python results
        run: python parity/make_cases.py --n 40 --seed 1
      - name: Run R
        run: Rscript parity/run_r.R parity/cases
      - name: Compare
        run: python parity/compare.py parity/cases --prefix r --tol 1e-7
      - name: Upload cases on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: parity-cases
          path: parity/cases
