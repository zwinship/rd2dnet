[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rd2dnet"
version = "0.1.0"
description = "Boundary discontinuity designs on street networks: a network-native extension of rd2d (Cattaneo, Titiunik and Yu)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Zach Winship" }]
keywords = ["regression discontinuity", "boundary discontinuity", "rd2d", "spatial", "networks", "causal inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "networkx>=3.2",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/zwinship/rd2dnet"
"rd2d (upstream method)" = "https://rdpackages.github.io/rd2d/"

[project.optional-dependencies]
osm = ["osmnx>=1.9", "pyproj>=3.5"]
igraph = ["igraph>=0.11"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7", "nbformat>=5.7", "nbclient>=0.7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rd2dnet.datasets" = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/rd2dnet"]
addopts = "-q -m \"not online and not notebook\" --doctest-modules"
markers = [
    "online: needs internet access (deselected by default; run with -m online)",
    "notebook: executes examples/tutorial.ipynb (deselected by default; run with -m notebook)",
]
