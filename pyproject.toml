[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdnet"
version = "0.1.0"
description = "Boundary discontinuity designs on street networks: network-native extension of rd2d"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zach Winship" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "networkx>=3.2",
    "shapely>=2.0",
]

[project.optional-dependencies]
osm = ["osmnx>=1.9", "pyproj>=3.5"]
igraph = ["igraph>=0.11"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rdnet.datasets" = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not online\""
markers = ["online: needs internet access (deselected by default; run with -m online)"]
